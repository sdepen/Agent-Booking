<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tester l'agent · Agent Booking</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --accent: #00e5ff;
        --accent-rgb: 0, 229, 255;
        --bg: #ffffff;
        --bg2: #f8fafc;
        --border: rgba(15, 20, 25, 0.08);
        --border2: rgba(15, 20, 25, 0.14);
        --text: #0f1419;
        --text2: #475066;
        --text3: #6b7280;
        --t: 0.2s ease;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        position: relative;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        background: #fff;
        border: 1px solid var(--border2);
        border-radius: 20px;
        padding: 34px 38px 30px;
        max-width: 780px;
        width: 100%;
        box-shadow: 0 30px 80px rgba(15, 20, 25, 0.1);
        position: relative;
      }
      .card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }
      .logo {
        display: inline-flex;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.045em;
        color: var(--text);
        text-decoration: none;
      }
      .logo span { color: var(--accent); font-weight: 700; }
      .title {
        font-size: 23px;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin: 14px 0 6px;
      }
      .subtitle {
        font-size: 13.5px;
        color: var(--text2);
        margin-bottom: 24px;
        line-height: 1.55;
      }
      .question {
        font-size: 11px;
        font-weight: 700;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        margin-bottom: 12px;
      }
      .domain-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 22px;
      }
      button.domain-option {
        background: var(--bg2);
        border: 1px solid var(--border2);
        color: var(--text);
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        border-radius: 14px;
        padding: 13px 13px;
        cursor: pointer;
        text-align: left;
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }
      button.domain-option span {
        display: block;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text3);
        margin-top: 6px;
      }
      button.domain-option:hover {
        border-color: rgba(15, 20, 25, 0.3);
        transform: translateY(-1px);
      }
      button.domain-option.active {
        background: rgba(var(--accent-rgb), 0.07);
        border-color: var(--accent);
      }
      label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--text3);
        text-transform: uppercase;
        display: block;
        margin-bottom: 12px;
      }
      input {
        width: 100%;
        background: var(--bg2);
        border: 1px solid var(--border2);
        border-radius: 14px;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        padding: 13px 16px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }
      input::placeholder { color: var(--text3); }
      input:focus {
        background: #fff;
        border-color: var(--accent);
        box-shadow: none;
      }
      button#start-btn {
        width: 100%;
        background: var(--accent);
        color: #000;
        font-family: inherit;
        font-weight: 600;
        font-size: 15px;
        padding: 14px;
        border-radius: 100px;
        border: none;
        cursor: pointer;
        margin-top: 24px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 2px 10px rgba(15, 20, 25, 0.12);
      }
      button#start-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(15, 20, 25, 0.16);
      }
      button#start-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        box-shadow: none;
      }
      a.back-link {
        display: block;
        text-align: center;
        color: var(--text3);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        margin-top: 14px;
        transition: color var(--t);
      }
      a.back-link:hover { color: var(--text); }
      a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      @media (max-width: 720px) {
        .domain-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 480px) {
        body { padding: 18px 14px; }
        .card { padding: 28px 20px 24px; }
      }
    </style>
      <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "ybo9tkvtoe");
    </script>
</head>
  <body>
    <div class="card">
      <div class="card-head">
        <a href="/" class="logo">Agent<span>Booking</span></a>
        <a class="back-link" href="/" style="margin:0">← Retour à l'accueil</a>
      </div>
      <div class="title">Tester l'agent</div>
      <div class="subtitle">
        Répondez aux 3 questions ci-dessous. Les réponses seront utilisées pour personnaliser la démo.
      </div>

      <div class="question">Quel type de domaine vous intéresse ?</div>
      <div class="domain-grid" id="domain-grid">
        <button class="domain-option" type="button" data-domain="boite_de_nuit">
          Boîte de nuit
          <span>Réservations VIP</span>
        </button>
        <button class="domain-option" type="button" data-domain="conciergerie">
          Conciergerie
          <span>Service premium</span>
        </button>
        <button class="domain-option" type="button" data-domain="tourisme">
          Tourisme
          <span>Activités & ventes</span>
        </button>
        <button class="domain-option" type="button" data-domain="location">
          Location
          <span>Villas & événements</span>
        </button>
      </div>

      <label for="business-name">Nom de l'établissement</label>
      <input id="business-name" type="text" placeholder="Ex. Le Club 54" autocomplete="off" />

      <div class="question" style="margin-top: 28px;">Quel est votre problème principal ?</div>
      <div class="domain-grid" id="problem-grid">
        <button class="domain-option" type="button" data-problem="repondre_messages">
          Répondre aux messages
          <span>Trop de sollicitations</span>
        </button>
        <button class="domain-option" type="button" data-problem="gerer_reservations">
          Gérer les réservations
          <span>Suivi & confirmation</span>
        </button>
        <button class="domain-option" type="button" data-problem="notifier_equipe">
          Notifier mon équipe
          <span>Alertes en temps réel</span>
        </button>
        <button class="domain-option" type="button" data-problem="autre">
          Autre
          <span>Besoin spécifique</span>
        </button>
      </div>

      <button id="start-btn" type="button" disabled>Commencer →</button>
    </div>

    <script>
      const nameInput = document.getElementById('business-name');
      const startBtn = document.getElementById('start-btn');
      const domainButtons = Array.from(document.querySelectorAll('[data-domain]'));
      const problemButtons = Array.from(document.querySelectorAll('[data-problem]'));

      let selectedDomain = null;
      let selectedProblems = new Set();

      const storedName = localStorage.getItem('agent_demo_name');
      const storedDomain = localStorage.getItem('agent_demo_domain');
      const storedProblems = localStorage.getItem('agent_demo_problem');

      if (storedName) nameInput.value = storedName;

      function setDomain(domain) {
        selectedDomain = domain;
        domainButtons.forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.domain === domain);
        });
        updateState();
      }

      function toggleProblem(problem) {
        if (selectedProblems.has(problem)) {
          selectedProblems.delete(problem);
        } else {
          selectedProblems.add(problem);
        }
        problemButtons.forEach((btn) => {
          btn.classList.toggle('active', selectedProblems.has(btn.dataset.problem));
        });
        updateState();
      }

      if (storedDomain) setDomain(storedDomain);
      if (storedProblems) {
        storedProblems.split(',').forEach(p => {
          selectedProblems.add(p);
          problemButtons.forEach(btn => btn.classList.toggle('active', selectedProblems.has(btn.dataset.problem)));
        });
        updateState();
      }

      domainButtons.forEach((btn) => {
        btn.addEventListener('click', () => setDomain(btn.dataset.domain));
      });

      problemButtons.forEach((btn) => {
        btn.addEventListener('click', () => toggleProblem(btn.dataset.problem));
      });

      function updateState() {
        const ready = nameInput.value.trim().length > 1 && !!selectedDomain && selectedProblems.size > 0;
        startBtn.disabled = !ready;
      }

      function startDemo() {
        if (startBtn.disabled) return;

        const businessName = nameInput.value.trim();
        localStorage.setItem('agent_demo_name', businessName);
        localStorage.setItem('agent_demo_domain', selectedDomain);
        localStorage.setItem('agent_demo_problem', Array.from(selectedProblems).join(','));
        window.location.href = '/agent';
      }

      nameInput.addEventListener('input', updateState);
      nameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !startBtn.disabled) {
          startDemo();
        }
      });

      startBtn.addEventListener('click', startDemo);
      updateState();
    </script>
  </body>
</html>
