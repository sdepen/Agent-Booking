<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Agent · Agent Booking</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --accent: #00e5ff;
        --accent-rgb: 0, 229, 255;
        --bg: #ffffff;
        --bg2: #f8fafc;
        --bg3: #eef2f7;
        --border: rgba(15, 20, 25, 0.08);
        --border2: rgba(15, 20, 25, 0.14);
        --text: #0f1419;
        --text2: #475066;
        --text3: #6b7280;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border2);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(14px);
      }
      .logo {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.045em;
        color: var(--text);
      }
      .logo span { color: var(--accent); font-weight: 700; }
      header a {
        color: var(--text3);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
      }
      header a:hover { color: var(--text); }
      .chat {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        padding: 24px 18px;
        gap: 12px;
      }
      .bubble {
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        max-width: 85%;
      }
      .bubble.bot {
        background: var(--bg2);
        border: 1px solid var(--border2);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
      }
      .bubble.user {
        background: var(--accent);
        color: #000;
        font-weight: 500;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
      }
      .bubble.meta {
        background: rgba(var(--accent-rgb), 0.08);
        border: 1px solid rgba(var(--accent-rgb), 0.4);
        color: var(--text2);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        align-self: center;
      }
      .bubble.error {
        background: rgba(220, 38, 38, 0.06);
        border: 1px solid rgba(220, 38, 38, 0.3);
        color: #b91c1c;
        align-self: center;
      }
      .typing {
        color: var(--text3);
        font-size: 12px;
        align-self: flex-start;
      }
      .input-row {
        flex-shrink: 0;
        display: flex;
        gap: 12px;
        padding: 18px 24px calc(env(safe-area-inset-bottom, 16px) + 18px);
        border-top: 1px solid var(--border2);
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(18px);
      }
      .input-row input {
        flex: 1;
        background: var(--bg2);
        border: 1px solid var(--border2);
        border-radius: 100px;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        padding: 13px 18px;
        outline: none;
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      .input-row input::placeholder { color: var(--text3); }
      .input-row input:focus {
        background: #fff;
        border-color: var(--accent);
      }
      .input-row button {
        background: var(--accent);
        border: none;
        border-radius: 100px;
        color: #000;
        font-weight: 600;
        font-family: inherit;
        font-size: 14px;
        padding: 13px 24px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 2px 10px rgba(15, 20, 25, 0.12);
      }
      .input-row button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(15, 20, 25, 0.16);
      }
      .input-row button:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
      a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      @media (max-width: 720px) {
        .chat { padding: 20px 16px; }
        .bubble { max-width: 90%; }
      }

      /* Popup recontact */
      .popup-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 20, 25, 0.4);
        backdrop-filter: blur(6px);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .popup-overlay.visible { display: flex; }
      .popup {
        background: #fff;
        border: 1px solid var(--border2);
        border-radius: 20px;
        padding: 34px 32px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 30px 80px rgba(15, 20, 25, 0.2);
        animation: popIn 0.2s ease-out;
      }
      @keyframes popIn {
        from { opacity: 0; transform: scale(0.95) translateY(8px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      .popup-title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
        margin-bottom: 8px;
      }
      .popup-sub {
        font-size: 13.5px;
        color: var(--text2);
        line-height: 1.6;
        margin-bottom: 20px;
      }
      .popup label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--text3);
        text-transform: uppercase;
        display: block;
        margin-bottom: 8px;
        margin-top: 16px;
      }
      .popup input {
        width: 100%;
        background: var(--bg2);
        border: 1px solid var(--border2);
        border-radius: 14px;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        padding: 13px 16px;
        outline: none;
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      .popup input:focus { background: #fff; border-color: var(--accent); }
      .popup-actions { display: flex; gap: 10px; margin-top: 24px; }
      .popup-submit {
        flex: 1;
        background: var(--accent);
        border: none;
        border-radius: 100px;
        color: #000;
        font-family: inherit;
        font-weight: 600;
        font-size: 14px;
        padding: 13px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 2px 10px rgba(15, 20, 25, 0.12);
      }
      .popup-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(15, 20, 25, 0.16); }
      .popup-skip {
        background: #fff;
        border: 1px solid var(--border2);
        border-radius: 100px;
        color: var(--text2);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        padding: 13px 18px;
        cursor: pointer;
      }
      .popup-skip:hover { border-color: rgba(15, 20, 25, 0.3); color: var(--text); }
      .popup-success { text-align: center; padding: 12px 0 4px; }
      .popup-success p { font-size: 14px; color: var(--text2); margin-top: 8px; }
    </style>
      <script type="text/javascript">
      // Cookies analytics (Microsoft Clarity) : chargé UNIQUEMENT après consentement.
      (function(){
        var KEY='ab_cookie_consent';
        function loadClarity(){
          (function(c,l,a,r,i,t,y){
              c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
              t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
              y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
          })(window, document, "clarity", "script", "ybo9tkvtoe");
        }
        var c=null; try{c=localStorage.getItem(KEY);}catch(e){}
        if(c==='yes'){loadClarity();return;}
        if(c==='no'){return;}
        function showBanner(){
          var lang='fr'; try{lang=localStorage.getItem('ab_lang')||'fr';}catch(e){}
          var en=lang==='en';
          var b=document.createElement('div');
          b.setAttribute('role','dialog');
          b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:1000;background:#fff;color:#0f1419;border:1px solid rgba(15,20,25,.16);border-radius:16px;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 12px 40px rgba(15,20,25,.16);max-width:calc(100vw - 32px);width:max-content;font-family:Inter,system-ui,sans-serif;font-size:13.5px;line-height:1.5';
          b.innerHTML=(en
            ? 'We use cookies to understand how the site is used (Microsoft Clarity). <a href="/confidentialite" style="color:#0f1419;text-decoration:underline">Privacy</a>'
            : 'On utilise des cookies pour comprendre comment le site est utilisé (Microsoft Clarity). <a href="/confidentialite" style="color:#0f1419;text-decoration:underline">Confidentialité</a>')
            +'<span style="display:inline-flex;gap:8px;margin-left:auto">'
            +'<button id="ab-ck-no" style="font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:100px;border:1px solid rgba(15,20,25,.2);background:#fff;color:#475066;cursor:pointer">'+(en?'Decline':'Refuser')+'</button>'
            +'<button id="ab-ck-yes" style="font-family:inherit;font-size:13px;font-weight:600;padding:9px 18px;border-radius:100px;border:none;background:#00e5ff;color:#000;cursor:pointer">'+(en?'Accept':'Accepter')+'</button>'
            +'</span>';
          document.body.appendChild(b);
          document.getElementById('ab-ck-yes').onclick=function(){try{localStorage.setItem(KEY,'yes');}catch(e){} b.remove(); loadClarity();};
          document.getElementById('ab-ck-no').onclick=function(){try{localStorage.setItem(KEY,'no');}catch(e){} b.remove();};
        }
        if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',showBanner);}else{showBanner();}
      })();
    </script>
</head>
  <body>
    <header>
      <a href="/" class="logo" style="text-decoration:none; color:inherit;">Agent<span>Booking</span></a>
      <span style="display:flex;gap:16px;align-items:baseline">
        <button onclick="toggleLang()" aria-label="Switch language" style="border:none;background:none;cursor:pointer;font:inherit;font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap;padding:0"><b id="lang-fr" style="color:var(--text)">FR</b> / <span id="lang-en">EN</span></button>
        <a href="/demo" id="edit-link">← Modifier la démo</a>
      </span>
    </header>

    <main class="chat" id="chat"></main>

    <div class="input-row">
      <input id="message-input" type="text" placeholder="Écrivez votre message..." autocomplete="off" />
      <button id="send-btn" type="button">Envoyer</button>
    </div>

    <!-- Popup recontact -->
    <div class="popup-overlay" id="popup-overlay">
      <div class="popup">
        <div id="popup-form">
          <div class="popup-title" id="pp-title">Vous voulez la même chose ?</div>
          <div class="popup-sub" id="pp-sub">Laissez vos coordonnées, on vous propose une solution 100% adaptée à votre business.</div>
          <label for="popup-mail" id="pp-mail-l">Email</label>
          <input id="popup-mail" type="email" placeholder="vous@exemple.com" autocomplete="email" />
          <label for="popup-whatsapp">WhatsApp</label>
          <input id="popup-whatsapp" type="tel" placeholder="+33 6 00 00 00 00" autocomplete="tel" />
          <div class="popup-actions">
            <button class="popup-submit" id="popup-submit">Être recontacté →</button>
            <button class="popup-skip" id="popup-skip">Plus tard</button>
          </div>
        </div>
        <div id="popup-success" class="popup-success" style="display:none;">
          <div style="font-size:32px;">✅</div>
          <p id="pp-ok">Parfait ! On revient vers vous très rapidement.</p>
        </div>
      </div>
    </div>

    <script>
      const T = {
        fr: {
          doc_title: "Test Agent · Agent Booking",
          edit: "← Modifier la démo",
          intro: "🎯 Mode démo connecté à l'agent Agent Booking",
          typing: "L'agent rédige...",
          input_ph: "Écrivez votre message...",
          send: "Envoyer",
          err: "Erreur de connexion : ",
          home: "← Retour à l'accueil",
          pp_title: "Vous voulez la même chose ?",
          pp_sub: "Laissez vos coordonnées, on vous propose une solution 100% adaptée à votre business.",
          pp_submit: "Être recontacté →", pp_skip: "Plus tard",
          pp_ok: "Parfait ! On revient vers vous très rapidement.",
        },
        en: {
          doc_title: "Try the agent · Agent Booking",
          edit: "← Edit the demo",
          intro: "🎯 Demo mode connected to the Agent Booking agent",
          typing: "The agent is typing...",
          input_ph: "Type your message...",
          send: "Send",
          err: "Connection error: ",
          home: "← Back to home",
          pp_title: "Want the same for your business?",
          pp_sub: "Leave your details and we will come back with a solution built for your business.",
          pp_submit: "Get a callback →", pp_skip: "Later",
          pp_ok: "Perfect! We will get back to you very soon.",
        }
      };
      let lang = 'fr'; try { lang = localStorage.getItem('ab_lang') || 'fr'; } catch (e) {}
      function applyLang() {
        document.documentElement.lang = lang;
        document.title = T[lang].doc_title;
        document.getElementById('edit-link').textContent = T[lang].edit;
        document.getElementById('message-input').placeholder = T[lang].input_ph;
        document.getElementById('send-btn').textContent = T[lang].send;
        document.getElementById('pp-title').textContent = T[lang].pp_title;
        document.getElementById('pp-sub').textContent = T[lang].pp_sub;
        document.getElementById('popup-submit').textContent = T[lang].pp_submit;
        document.getElementById('popup-skip').textContent = T[lang].pp_skip;
        document.getElementById('pp-ok').textContent = T[lang].pp_ok;
        const fr = document.getElementById('lang-fr'), en = document.getElementById('lang-en');
        if (fr) fr.style.color = lang === 'fr' ? 'var(--text)' : 'var(--text3)';
        if (en) en.style.color = lang === 'fr' ? 'var(--text3)' : 'var(--text)';
      }
      function toggleLang() { lang = lang === 'fr' ? 'en' : 'fr'; try { localStorage.setItem('ab_lang', lang); } catch (e) {} applyLang(); }

      const WEBHOOK_URL = '/api/chat';
      const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzuB0nVcB8qN5ERBywFUR5jl82jWCHeI6A03c-1D0_UdtC0YTW_VqsdKf5eIbtzf3fU/exec';
      const BUSINESS_NAME = localStorage.getItem('agent_demo_name') || 'votre établissement';
      const BUSINESS_DOMAIN = localStorage.getItem('agent_demo_domain') || 'autre';
      const BUSINESS_PROBLEM = localStorage.getItem('agent_demo_problem') || 'autre';

      // Unique session ID per demo — prevents n8n memory from mixing users
      const SESSION_ID = crypto.randomUUID();

      const DOMAIN_LABELS = {
        boite_de_nuit: 'Boîte de nuit',
        conciergerie: 'Conciergerie',
        tourisme: 'Tourisme',
        location: 'Location',
      };

      const chat = document.getElementById('chat');
      const input = document.getElementById('message-input');
      const sendBtn = document.getElementById('send-btn');

      function addBubble(text, type) {
        const el = document.createElement('div');
        el.className = type === 'typing' ? 'typing' : `bubble ${type}`;
        el.textContent = text;
        chat.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
        return el;
      }

      function showIntro() {
        addBubble(T[lang].intro, 'meta');
      }

      let typingBubble = null;

      function showTyping() {
        if (!typingBubble) {
          typingBubble = addBubble(T[lang].typing, 'typing');
        }
      }

      function hideTyping() {
        if (typingBubble) {
          typingBubble.remove();
          typingBubble = null;
        }
      }

      function sendMessage() {
        const content = input.value.trim();
        if (!content) return;

        addBubble(content, 'user');
        input.value = '';
        sendBtn.disabled = true;
        showTyping();

        fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            chatInput: content,
            sessionId: SESSION_ID,
            source: 'agentbooking-demo',
            clubName: BUSINESS_NAME,
            domain: BUSINESS_DOMAIN,
            problem: BUSINESS_PROBLEM,
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            hideTyping();
            const answer = data.output || data.message || data.text || JSON.stringify(data);
            addBubble(answer, 'bot');
            sendBtn.disabled = false;
            input.focus();
            if (answer.startsWith('Votre réservation est maintenant confirmée')) {
              setTimeout(() => showPopup(), 3000);
            }
          })
          .catch((error) => {
            hideTyping();
            addBubble(T[lang].err + error.message, 'error');
            sendBtn.disabled = false;
            input.focus();
          });
      }

      sendBtn.addEventListener('click', sendMessage);
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          sendMessage();
        }
      });

      // Popup recontact
      const popupOverlay = document.getElementById('popup-overlay');

      function showPopup() {
        popupOverlay.classList.add('visible');
      }

      document.getElementById('popup-skip').addEventListener('click', () => {
        popupOverlay.classList.remove('visible');
        showHomeButton();
      });

      function showHomeButton() {
        const el = document.createElement('a');
        el.href = '/';
        el.className = 'bubble meta';
        el.style.cursor = 'pointer';
        el.style.textDecoration = 'none';
        el.textContent = T[lang].home;
        chat.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
      }

      document.getElementById('popup-submit').addEventListener('click', () => {
        const mail = document.getElementById('popup-mail').value.trim();
        const whatsapp = document.getElementById('popup-whatsapp').value.trim();
        if (!mail && !whatsapp) return;

        const params = new URLSearchParams({
          businessName: BUSINESS_NAME,
          domain: BUSINESS_DOMAIN,
          problem: BUSINESS_PROBLEM,
          whatsapp,
          mail,
        });
        new Image().src = `${SHEETS_URL}?${params}`;

        document.getElementById('popup-form').style.display = 'none';
        document.getElementById('popup-success').style.display = 'block';
        setTimeout(() => {
          popupOverlay.classList.remove('visible');
          showHomeButton();
        }, 2500);
      });

      applyLang();
      showIntro();
      input.focus();
    </script>
  </body>
</html>
